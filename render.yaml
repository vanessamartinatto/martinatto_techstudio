# ================================================================
# Render Blueprint — Martinatto Tech_Studio
#
# Deploy em 1 passo:
#   Render Dashboard -> New + -> Blueprint -> escolha este repositorio
#   (o Render le este arquivo e pre-configura tudo)
#
# Custo: plano Starter (~USD 7/mes) + disco 1GB (~USD 0,25/mes)
#        O plano gratuito nao suporta disco persistente e "dorme"
#        apos 15 min sem trafego.
# ================================================================

services:
  - type: web
    name: martinatto-tech-studio
    runtime: node
    plan: starter
    region: frankfurt          # mais proximo da Italia
    branch: main
    autoDeploy: true

    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push --skip-generate && node .next/standalone/server.js

    envVars:
      - key: NODE_VERSION
        value: "22"
      # SQLite vive no disco persistente (sobrevive a deploys/restarts)
      - key: DATABASE_URL
        value: file:/var/data/custom.db
      # Formulario de contato -> e-mail (SMTP IONOS)
      - key: CONTACT_EMAIL
        value: info@martinatto.it
      - key: SMTP_HOST
        value: smtp.ionos.it
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: info@martinatto.it
      # SENHA: preencha no dashboard (Environment) depois do primeiro deploy.
      # sync:false = o Render pede o valor na hora do deploy e nunca salva no git.
      - key: SMTP_PASS
        sync: false

    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
